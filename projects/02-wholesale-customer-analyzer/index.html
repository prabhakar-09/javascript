<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wholesale Customer Analyzer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Wholesale Customer Analyzer</h1>

  <p>Analyze wholesale customer spending using real CSV data.</p>

  <section>
    <h2>Dataset Summary</h2>

    <p id="customer-count">
        Customers Loaded: Loading...
    </p>

    <p id="average-grocery">
        Average Grocery Spend: Loading...
    </p>

    <p id="highest-customer">
      Highest-Spending Customer: Loading...
    </p>

    </section>

  <section>
  <h2>Customer Records</h2>
  <label for="channel-filter">Filter by Channel:</label>

  <select id="channel-filter">
    <option value="all">All</option>
    <option value="1">Channel 1</option>
    <option value="2">Channel 2</option>
  </select>

  <table id="customer-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Channel</th>
        <th>Region</th>
        <th>Fresh</th>
        <th>Milk</th>
        <th>Grocery</th>
      </tr>
    </thead>

    <tbody id="customer-table-body">
    </tbody>
  </table>
</section>

  <script src="script.js"></script>
</body>
</html>
